<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SkinTec</title>
    <meta name="description" content="SkinTec walks you through your skincare plan one step at a time: dapsone mornings, BHA, adapalene and recovery nights." />
    <meta name="theme-color" content="#f6bfd6" />
    <link rel="manifest" href="/Skintec/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/Skintec/icons/skintec-mark.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/Skintec/icons/icon-192.png" />
    <!-- Absolute paths: a page-relative href 404s when Safari is on /Skintec without a trailing slash. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Skintec/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/Skintec/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SkinTec" />
    <meta name="application-name" content="SkinTec" />
        <script>
      /*
       * Paint the first frame in the colour SkinTec last showed. React repaints
       * once it knows today's routine; this only stops a flash of the wrong
       * colour behind the status bar and the launch screen.
       */
      (function () {
        var BG = {
          day: { am: '#fcec9c', bha: '#ffcfae', adapalene: '#c3cbff', recovery: '#f6bfd6' },
          night: { am: '#2a2306', bha: '#2e1509', adapalene: '#12173f', recovery: '#2a0f1d' }
        };
        var mood = 'recovery';
        var theme = 'day';
        try {
          var paint = JSON.parse(localStorage.getItem('skintec.paint') || 'null');
          if (paint && BG.day[paint.mood]) mood = paint.mood;
          if (paint && (paint.theme === 'day' || paint.theme === 'night')) theme = paint.theme;
        } catch (error) {
          /* Unreadable storage just means the default colour. */
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.add('mood-' + mood);
        var meta = document.querySelector('meta[name="theme-color"]:not([media])');
        if (meta) meta.setAttribute('content', BG[theme][mood]);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <p class="boot-name">SkinTec</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
